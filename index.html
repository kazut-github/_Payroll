<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="payroll_2.css">
    <!-- レスポンシブCSS -->
    <!-- <link rel="stylesheet" href="responsive.css"> -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
  </head>
  <body>
    <header>
      <div class="container">
        <div class="row mt-1 p-1">
          <div class="col-3" >
                  <!-- <button type="reset" class="reset_btn">クリア</button> -->
            Top
          </div>
          <div class="col-6">
            簡単給与計算
          </div>
          <div class="col-3">
            <!-- Menu -->
          </div>
        </div>
      </div>
</header>
 <main>
  <div class="main-container">
   <div class="top-wrapper">
     <div class="row">
      <div class="col-12">
       <h1>給与計算ツール</h1>
             </div>
 <hr>
             <!-- エラー時，ユーザーにwindowアラート表示 追加-->
              
      <div class="middle-wrappar">
           <!-- 会社１ -->
            <div class="company_one">
             <h3 class="company_name">社名１</h3>
              <div class="row">
               <!-- スマホ時，input 適用させる→style="width:100px;" -->
               <div class="col-4 col-xl-2">
                 <form name="calculate_one">時給</form>
                 <input type="number" name="hour sarary" id="js-hourSalary" class="one_salary" style="width: 100px;"> ×
                </div>
                <div class="col-4 col-xl-2">
                 <form name="calculate_one">時間（1日）</form>
                 <input type="number" name="hours" id="js-hours" class="one_salary" style="width: 100px;"> =
                </div>
                <div class="col-4 col-xl-2">
                  <form action="">日額</form>
                  <input type="number" name="Day sarary" class="one_salary" id="js-daySalary" readonly placeholder="日額 入力不可" style="width: 130px;"> ×
                 </div>
              <div class="col-4 col-xl-2">
                <form action="">日数</form>
                <input type="number" name="days" id="js-days" class="one_salary" style="width: 100px;"> =
               </div>
               <div class="col-4 col-xl-2">
                <form action="">合計(月額)</form>
                <input type="number" name="total" class="one_salary" id="js-total" readonly placeholder="月額  入力不可" style="width: 150px;">
               </div>
               <div class="col-4 col-xl-2">
                <div class="calculator">
                  <button class="calculate_btn">計算</button>
                  <!-- <button type="reset" class="reset_btn">クリア</button> -->
                 </div>  
               </div>
             </div>        
             
  <!-- 会社２ -->
    <div class="company_second">
      <h3 class="company_name">社名２</h3>
        <div class="row">
            <!-- スマホ時，input 適用させる→style="width:100px;" -->
            <div class="col-4 col-xl-2">
              <form name="calculate_one">時給</form>
              <input type="number" name="hour sarary" id="js-hourSalary-sec" class="one_salary" style="width: 100px;"> ×
             </div>
             <div class="col-4 col-xl-2">
              <form name="calculate_one">時間（1日）</form>
              <input type="number" name="hours" id="js-hours-sec" class="one_salary" style="width: 100px;"> =
             </div>
             <div class="col-4 col-xl-2">
               <form action="">日額</form>
               <input type="number" name="Day sarary" class="one_salary" id="js-daySalary-sec" readonly placeholder="日額 入力不可" style="width: 130px;"> ×
              </div>
           <div class="col-4 col-xl-2">
             <form action="">日数</form>
             <input type="number" name="days" id="js-days-sec" class="one_salary" style="width: 100px;"> =
            </div>
            <div class="col-4 col-xl-2">
             <form action="">合計(月額)</form>
             <input type="number" name="total" class="one_salary" id="js-total-sec" readonly placeholder="月額  入力不可" style="width: 150px;">
            </div>
            <div class="col-4 col-xl-2">
             <div class="calculator">
               <button class="calculate_btn">計算</button>
               <!-- <button type="reset" class="reset_btn">クリア</button> -->
              </div>  
            </div>
          </div>

        </div>
       </div>

    </main>
    
    <footer>
      <p>＠Kazut Creation</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="payroll_2.js"></script>

  </body>
</html>
